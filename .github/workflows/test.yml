name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static checks — these always run.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck
        # -x lets ShellCheck follow the sourced install.sh from packages_test.sh.
        run: shellcheck -x scripts/install.sh scripts/packages_test.sh scripts/release_meta.sh scripts/release_meta_test.sh

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Test package resolution
        run: bash scripts/packages_test.sh

      - name: Test release tag normalization
        run: bash scripts/release_meta_test.sh

  # Integration test: install the packages, then build and run a small
  # Ebitengine game on every supported platform.
  install:
    name: Build and run (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ebitengine
        id: setup
        uses: ./
        with:
          xvfb: true

      - name: Print resolved outputs
        shell: bash
        env:
          PACKAGES: ${{ steps.setup.outputs.packages }}
          PACKAGE_MANAGER: ${{ steps.setup.outputs.package-manager }}
        run: |
          echo "package-manager=${PACKAGE_MANAGER}"
          echo "packages=${PACKAGES}"

      - name: Check the outputs
        shell: bash
        env:
          PACKAGES: ${{ steps.setup.outputs.packages }}
          PACKAGE_MANAGER: ${{ steps.setup.outputs.package-manager }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Linux" ]; then
            [ "${PACKAGE_MANAGER}" = "apt" ] || { echo "package-manager: ${PACKAGE_MANAGER}" >&2; exit 1; }
            case " ${PACKAGES} " in
              *" xvfb xauth "*) ;;
              *) echo "xvfb: true did not add xvfb and xauth: ${PACKAGES}" >&2; exit 1 ;;
            esac
            for p in ${PACKAGES}; do dpkg -s "$p" >/dev/null || { echo "${p} is not installed" >&2; exit 1; }; done
          else
            [ "${PACKAGE_MANAGER}" = "none" ] || { echo "package-manager: ${PACKAGE_MANAGER}" >&2; exit 1; }
            [ -z "${PACKAGES}" ] || { echo "packages: ${PACKAGES}" >&2; exit 1; }
          fi

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache-dependency-path: testdata/smoke/go.sum

      - name: Build the smoke game
        working-directory: testdata/smoke
        run: go build -o smoke .

      - name: Run the smoke game headless (Linux)
        if: runner.os == 'Linux'
        working-directory: testdata/smoke
        run: xvfb-run --auto-servernum ./smoke

  # Linux distributions that are not Ubuntu, run in containers.
  container:
    name: Build (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:stable", "ubuntu:22.04", "fedora:latest", "archlinux:latest"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ebitengine
        uses: ./
        with:
          xvfb: true
          extra-packages: tar gzip ca-certificates

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false

      - name: Build and run the smoke game
        working-directory: testdata/smoke
        run: |
          go build -o smoke .
          xvfb-run --auto-servernum ./smoke

  # Alpine (musl): Go comes from apk, as actions/setup-go ships glibc builds.
  alpine:
    name: Build (alpine:latest)
    runs-on: ubuntu-latest
    container: alpine:latest
    timeout-minutes: 15
    steps:
      - name: Install bash, Go and git
        run: apk add --no-cache bash go git ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ebitengine
        uses: ./
        with:
          xvfb: true

      - name: Build and run the smoke game
        working-directory: testdata/smoke
        env:
          GOTOOLCHAIN: auto
        # -buildvcs=false: the checkout belongs to another user inside the container
        run: |
          go build -buildvcs=false -o smoke .
          xvfb-run ./smoke

  # The dev input: a C compiler and the headers, for cgo builds.
  dev:
    name: Build with cgo (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ebitengine
        uses: ./
        with:
          dev: true
          xvfb: true

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache-dependency-path: testdata/smoke/go.sum

      - name: Build with cgo and run the smoke game
        working-directory: testdata/smoke
        env:
          CGO_ENABLED: "1"
        run: |
          go build -o smoke .
          xvfb-run --auto-servernum ./smoke

  # apt-update: false must skip the index update and still install, and
  # extra-packages must reach apt-get. The first step refreshes the index so
  # the second does not depend on the runner image's lists.
  extra-packages:
    name: Extra packages without apt update (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ebitengine (refreshes the apt index)
        uses: ./

      - name: Setup Ebitengine with extra packages and no apt update
        id: extra
        uses: ./
        with:
          apt-update: "false"
          extra-packages: |
            libxxf86vm1
            libxss1

      - name: The extra packages are listed and installed
        shell: bash
        env:
          PACKAGES: ${{ steps.extra.outputs.packages }}
        run: |
          set -euo pipefail
          case " ${PACKAGES} " in
            *" libxxf86vm1 libxss1 "*) ;;
            *) echo "extra packages missing from the output: ${PACKAGES}" >&2; exit 1 ;;
          esac
          dpkg -s libxxf86vm1 libxss1 >/dev/null

  # Misspelled booleans and options in extra-packages must fail the step on
  # every OS, before anything is installed.
  reject:
    name: Reject invalid inputs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Ebitengine, expected to fail: dev: ture"
        id: dev
        continue-on-error: true
        uses: ./
        with:
          dev: ture

      - name: "Setup Ebitengine, expected to fail: xvfb: enabled"
        id: xvfb
        continue-on-error: true
        uses: ./
        with:
          xvfb: enabled

      - name: "Setup Ebitengine, expected to fail: apt-update: nope"
        id: aptupdate
        continue-on-error: true
        uses: ./
        with:
          apt-update: nope

      - name: "Setup Ebitengine, expected to fail: an option in extra-packages"
        id: option
        continue-on-error: true
        uses: ./
        with:
          extra-packages: libfoo --allow-unauthenticated

      - name: Every setup step must have failed
        shell: bash
        env:
          OUTCOME_DEV: ${{ steps.dev.outcome }}
          OUTCOME_XVFB: ${{ steps.xvfb.outcome }}
          OUTCOME_APTUPDATE: ${{ steps.aptupdate.outcome }}
          OUTCOME_OPTION: ${{ steps.option.outcome }}
        run: |
          set -euo pipefail
          status=0
          for name in $(compgen -A variable OUTCOME_); do
            if [ "${!name}" = "failure" ]; then
              echo "ok:   ${name#OUTCOME_} failed"
            else
              echo "FAIL: ${name#OUTCOME_} -> ${!name}" >&2
              status=1
            fi
          done
          exit "${status}"
